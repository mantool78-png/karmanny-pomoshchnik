<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bioGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="bioShadow" x="6" y="8" width="52" height="52" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#047857" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#bioShadow)">
    <!-- Сочный зелёный листок растения -->
    <path d="M48 14C34 14 16 24 16 44C24 44 44 42 48 14Z" fill="url(#bioGrad)"/>
    <!-- Прожилки листа (символ клеточной структуры и биологии) -->
    <path d="M16 44C26 36 38 24 48 14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M26 35C29 32 35 32 38 33" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round"/>
    <path d="M33 27C36 24 41 23 44 24" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round"/>
    <path d="M23 41C26 41 29 42 32 40" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Черешок листа -->
    <path d="M16 44C13 47 11 51 12 54" stroke="#047857" stroke-width="3" stroke-linecap="round"/>

    <!-- Росинка / растительная клетка с ядром -->
    <circle cx="26" cy="24" r="5" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="26" cy="24" r="2" fill="#059669"/>
  </g>
</svg>
